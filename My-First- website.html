<!DOCTYPE html>
<html>
<head><title>My First Website</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);color:white;text-align:center;padding:40px}
.card{background:white;color:#333;padding:25px;border-radius:20px;max-width:500px;margin:20px auto}
button{background:#667eea;color:white;border:none;padding:15px 30px;border-radius:30px;font-size:18px}
</style>
</head>
<body>
<h1>🎉 My First Website 🎉</h1>
<h2>Random Fun Facts!</h2>
<div class="card"><p id="fact">Click the button!</p></div>
<button onclick="newFact()">Get New Fact 🚀</button>
<script>
const facts=["Octopuses have 3 hearts! 💜","Honey never spoils!","A day on Venus is longer than a year! 🪐","Bananas are berries! 🍌","More trees than stars! 🌳"];
function newFact(){document.getElementById('fact').innerHTML=facts[Math.floor(Math.random()*facts.length)];}
</script>
<p>Built with Copilot - #MyFirstWebsite</p>
</body>
</html>
